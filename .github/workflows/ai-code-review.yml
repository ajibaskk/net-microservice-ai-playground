name: CI & AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------
      # STAGE 1: COMPILER & LINTER CHECK (.NET & GOLANG)
      # -------------------------------------------------------------
      - name: Check .NET Project
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter *.csproj -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($csproj) {
            Write-Host "==> Proyek .NET terdeteksi di: $($csproj.FullName)"
            Write-Host "==> Menjalankan dotnet build..."
            dotnet build "$($csproj.FullName)" --no-incremental /clp:ErrorsOnly
          } else {
            Write-Host "==> Bukan proyek .NET, melewati step ini."
          }

      - name: Check Golang Project
        run: |
          if (Test-Path "go.mod") {
            Write-Host "==> Proyek Golang terdeteksi. Menjalankan go vet..."
            go vet ./...
          } else {
            Write-Host "==> Bukan proyek Golang, melewati step ini."
          }

      # -------------------------------------------------------------
      # STAGE 2: ADVANCED AI CODE REVIEW (QWEN 27B)
      # -------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR Diff & Run Local AI Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const execSync = require('child_process').execSync;

            async function runReview() {
              // 1. Ambil Git Diff
              let diff = '';
              try {
                diff = execSync('git diff origin/' + context.payload.pull_request.base.ref + '...HEAD', { encoding: 'utf-8' });
              } catch (err) {
                console.error('Gagal mengambil git diff:', err);
                return;
              }

              if (!diff || diff.trim() === '') {
                console.log('Tidak ada perubahan kode.');
                return;
              }

              const maxDiffLength = 16000;
              const truncatedDiff = diff.length > maxDiffLength ? diff.substring(0, maxDiffLength) + '\n...[Diff dipotong]' : diff;

              // 2. Prompt Komprehensif Arsitektur, Clean Code, Logic Bug & Naming
              const systemPrompt = `Bertindaklah sebagai Lead Software Architect & Principal Code Reviewer untuk proyek C# (.NET) dan Golang.
              Evaluasi perubahan kode (diff) berikut secara kritis dan terperinci berdasarkan standar utama berikut:

              1. ARSITEKTUR & DESAIN LAYER
                 - Clean/Hexagonal Architecture: Layer Domain/Core TIDAK BOLEH mengimpor/memanggil paket dari Infrastructure, Persistence, atau API.
                 - API Handler/Controller HANYA BOLEH memanggil Use Case / Service / Mediator (dilarang query DB/Repository langsung).
                 - Prinsip SOLID: Single Responsibility, Dependency Inversion (bergantung pada Interface/Abstraksi).

              2. LOGIC BUGS & POTENSI ERROR FATAL
                 - Cek potensi NullReferenceException (C#) / Nil Pointer Dereference (Go).
                 - Cek kesalahan logika kondisi (misal: kondisi 'if' yang salah, off-by-one error pada loop, operator logika yang terbalik).
                 - Cek potensi Resource Leak (IDisposable tanpa 'using' di .NET, atau Goroutine leak / Channel mati di Go).
                 - Cek kesalahan Asynchronous: .Result / .Wait() di .NET, atau unhandled Goroutine error di Go.

              3. PENULISAN NAMA FUNCTION & VARIABLE (NAMING CONVENTIONS)
                 - C# (.NET): PascalCase untuk Method, Property, Class; camelCase untuk parameter & private variable (misal: '_repository').
                 - Golang: camelCase untuk private, PascalCase untuk exported/public (misal: 'UserResponse' vs 'userResponse').
                 - Semantik Nama: Nama fungsi WAJIB berupa Kata Kerja (Verb). Nama variabel WAJIB menggambarkan data. Fungsi boolean HARUS menggunakan awalan 'Is', 'Has', atau 'Can'.

              4. CLEAN CODE & READABILITY
                 - Hindari 'Magic Numbers' atau 'Magic Strings' (gunakan Constant / Enum).
                 - Golang: Wajib mengecek error (if err != nil) dan melakukan error wrapping (fmt.Errorf("...: %w", err)).

              --- FORMAT OUTPUT ULASAN ---
              Berikan ulasan singkat dan jelas dalam Bahasa Indonesia dengan struktur berikut:
              1. **Ringkasan Perubahan:** (1-2 kalimat ringkasan)
              2. **Temuan Masalah (Arsitektur / Logic Bug / Naming / Clean Code):** (Sebutkan nama file, perkiraan baris, jenis masalah, dan alasan pelanggarannya)
              3. **Saran Perbaikan Kode:** (Berikan contoh snippet kode perbaikannya yang benar)
              4. **Keputusan Final:** 
                 - Jika terdapat kesalahan arsitektur, logic bug, penamaan yang membingungkan, atau clean code yang buruk, AKHIRI balasan Anda dengan teks persis: **[REJECTED]**
                 - Jika kode sudah bersih dan memenuhi semua standar, AKHIRI balasan Anda dengan teks persis: **[APPROVED]**`;

              const prompt = `${systemPrompt}\n\nBerikut diff kode:\n\`\`\`diff\n${truncatedDiff}\n\`\`\``;

              console.log('Mengirimkan diff ke Ollama lokal (Qwen 27B)...');

              try {
                // 3. Panggil API Ollama (IP 127.0.0.1 agar terhindar dari isu IPv6)
                const response = await fetch('http://127.0.0.1:11434/api/generate', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  duplex: 'half',
                  body: JSON.stringify({
                    model: 'qwen3.8:27b',
                    prompt: prompt,
                    stream: false,
                    options: {
                      temperature: 0.1,
                      top_p: 0.9,
                      num_ctx: 16384
                    }
                  })
                });

                if (!response.ok) throw new Error(`Ollama Error: ${response.statusText}`);

                const data = await response.json();
                const reviewResult = data.response;

                // 4. Posting Komentar Hasil Review ke Pull Request
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `### 🤖 Advanced AI Code Review (Qwen 3.8 - 27B)\n\n${reviewResult}`
                });

                // 5. Penentuan Kelulusan Status Check
                if (reviewResult.includes('[REJECTED]')) {
                  core.setFailed('❌ AI Reviewer Menolak PR ini: Ditemukan pelanggaran arsitektur, logic bug, atau clean code.');
                } else {
                  console.log('✅ AI Reviewer Menyetujui PR ini.');
                }

              } catch (error) {
                core.setFailed(`Gagal menjalankan AI Review: ${error.message}`);
              }
            }

            await runReview();