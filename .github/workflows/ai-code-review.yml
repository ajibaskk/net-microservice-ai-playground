name: AI Code Reviewer (Lokal Ollama)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR Diff & Run Local AI Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const execSync = require('child_process').execSync;

            // 1. Ambil diff perubahan kode dari git
            let diff = '';
            try {
              diff = execSync('git diff origin/' + context.payload.pull_request.base.ref + '...HEAD', { encoding: 'utf-8' });
            } catch (err) {
              console.error('Gagal mengambil git diff:', err);
              return;
            }

            if (!diff || diff.trim() === '') {
              console.log('Tidak ada perubahan kode yang ditemukan.');
              return;
            }

            const maxDiffLength = 8000;
            const truncatedDiff = diff.length > maxDiffLength ? diff.substring(0, maxDiffLength) + '\n...[Diff dipotong karena terlalu panjang]' : diff;

            // 2. Prompt yang disempurnakan dengan instruksi Syntax Error Check
            const systemPrompt = `Bertindaklah sebagai Senior Code Reviewer dan Architect untuk .NET (C#) dan Golang.
            Tugas utama Anda adalah mengevaluasi perubahan kode (diff) ini secara teliti:

            1. **Sintaks & Syntax Error (PRIORITAS UTAMA):**
               - Periksa dengan cermat kesalahan sintaks C# / Go pada baris bertanda '+'.
               - Cari kesalahan seperti: tanda titik koma ekstra (misal: 'public string Title { get; set; };'), tanda kurung tidak lengkap, tipe data salah, atau penulisan keyword yang keliru.
            
            2. **Arsitektur & Clean Code:**
               - Laporkan jika ada pelanggaran batas layer (misal Controller/Handler memanggil DB/Repository langsung).
               - Cek error handling di Golang (fmt.Errorf wrapping) dan .NET (async/await, Result pattern).

            Jika menemukan kesalahan sintaks, SEBUTKAN BARIS KODE YANG SALAH dan jelaskan perbaikannya.`;

            const prompt = `${systemPrompt}\n\nBerikut adalah diff kode:\n\`\`\`diff\n${truncatedDiff}\n\`\`\``;

            console.log('Mengirimkan diff ke Ollama lokal...');

            // 3. Panggil API Ollama lokal (diperbaiki header application/json dan temperature)
            try {
              const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'qwen2.5-coder:7b',
                  prompt: prompt,
                  stream: false,
                  options: {
                    temperature: 0.1 // Temperature rendah agar AI lebih kritis dan presisi
                  }
                })
              });

              if (!response.ok) {
                throw new Error(`Ollama API Error: ${response.status} ${response.statusText}`);
              }

              const data = await response.json();
              const reviewResult = data.response;

              // 4. Kirim komentar hasil review ke Pull Request
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 🤖 AI Code Review (Local Qwen2.5-Coder)\n\n${reviewResult}`
              });

              console.log('Berhasil menambahkan komentar review ke PR!');
            } catch (error) {
              core.setFailed(`Gagal menjalankan AI Review: ${error.message}`);
            }