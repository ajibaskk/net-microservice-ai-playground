name: AI Code Reviewer (Lokal Ollama)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR Diff & Run Local AI Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const execSync = require('child_process').execSync;

            // 1. Ambil diff perubahan kode dari git
            let diff = '';
            try {
              diff = execSync('git diff origin/' + context.payload.pull_request.base.ref + '...HEAD', { encoding: 'utf-8' });
            } catch (err) {
              console.error('Gagal mengambil git diff:', err);
              return;
            }

            if (!diff || diff.trim() === '') {
              console.log('Tidak ada perubahan kode.');
              return;
            }

            const maxDiffLength = 8000;
            const truncatedDiff = diff.length > maxDiffLength ? diff.substring(0, maxDiffLength) + '\n...[Diff dipotong]' : diff;

            // 2. System Prompt dengan instruksi status penolakan/persetujuan
            const systemPrompt = `Bertindaklah sebagai Senior Software Architect untuk .NET dan Golang.
            Evaluasi perubahan kode (diff) berikut berdasarkan standar:
            1. Arsitektur: Batas antar-layer (misal Controller/Handler tidak boleh akses DB/Repository langsung).
            2. Clean Code: Kejelasan logika, penamaan, dan pembungkusan error (fmt.Errorf pada Go).
            3. Best Practice: Penggunaan async/await, Result pattern pada .NET, serta potensi bug logika.

            Aturan Output Status:
            - Jika ADA pelanggaran arsitektur, bug fatal, atau clean code yang buruk, jelaskan poin masalahnya lalu AKHIRI respon Anda dengan kata '[REJECTED]'.
            - Jika kode SUDAH SESUAI dan tidak ada masalah, berikan apresiasi ringkas lalu AKHIRI respon Anda dengan kata '[APPROVED]'.`;

            const prompt = `${systemPrompt}\n\nBerikut diff kode:\n\`\`\`diff\n${truncatedDiff}\n\`\`\``;

            console.log('Mengirimkan diff ke Ollama lokal...');

            try {
              // 3. Panggil API Ollama lokal
              const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'qwen2.5-coder:7b',
                  prompt: prompt,
                  stream: false,
                  options: { temperature: 0.1 }
                })
              });

              if (!response.ok) throw new Error(`Ollama Error: ${response.statusText}`);

              const data = await response.json();
              const reviewResult = data.response;

              // 4. Buat komentar hasil review di Pull Request
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 🤖 AI Code Review (Local Qwen2.5-Coder)\n\n${reviewResult}`
              });

              // -------------------------------------------------------------
              // LOGIKA PENENTUAN STATUS CHECK GITHUB (DISINI TAMBAHANNYA)
              // -------------------------------------------------------------
              if (reviewResult.includes('[REJECTED]')) {
                core.setFailed('❌ AI Code Reviewer Menolak PR ini: Ditemukan pelanggaran arsitektur atau clean code. Silakan perbaiki sesuai komentar AI di atas.');
              } else {
                console.log('✅ AI Code Reviewer Menyetujui PR ini.');
              }

            } catch (error) {
              core.setFailed(`Gagal menjalankan AI Review: ${error.message}`);
            }