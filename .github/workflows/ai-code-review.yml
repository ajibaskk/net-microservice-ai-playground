name: AI Code Reviewer (Lokal)

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    # Memerintahkan job untuk berjalan di PC lokal kamu
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # Mengakses Ollama yang berjalan di PC lokal
          OPENAI_BASE_URL: "http://localhost:11434/v1"
          OPENAI_KEY: "ollama-dummy-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Nama model yang tadi sudah kita unduh
          OPENAI_MODEL: "qwen2.5-coder:7b"
          
          # Instruksi peninjauan kode
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            1. Periksa batas layer arsitektur (.NET Clean Architecture / Golang Hexagonal).
            2. Pastikan penanganan error di Golang dibungkus (wrapped) dengan benar.
            3. Berikan saran perbaikan kode jika ada pelanggaran Clean Code atau prinsip SOLID.