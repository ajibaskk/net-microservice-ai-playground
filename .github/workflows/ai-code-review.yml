name: AI Code Reviewer (Lokal Cross-Platform)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: anc95/ChatGPT-CodeReview@v1
        with:
          # Arahkan endpoint ke Ollama lokal
          openai_base_path: "http://localhost:11434/v1"
          openai_api_key: "ollama-dummy-key"
          openai_api_model: "qwen2.5-coder:7b"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: "id"
          
          prompt: |
            Bertindaklah sebagai Senior Software Architect untuk .NET dan Golang.
            Evaluasi perubahan kode (diff) ini berdasarkan standar berikut:
            - **Arsitektur:** Laporkan jika ada pelanggaran batas layer (misal: Controller memanggil DB langsung).
            - **Clean Code:** Evaluasi penamaan variabel, kompleksitas fungsi, dan keterbacaan kode.
            - **Golang Specific:** Cek penanganan error (`if err != nil`), pastikan error di-wrap dengan benar (`fmt.Errorf`).
            - **.NET Specific:** Cek penggunaan Result pattern, async/await, dan exception handling.